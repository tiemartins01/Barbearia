services:
  postgres:
    image: postgres:16-alpine
    container_name: barbearia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: barbearia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - barbearia_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barbearia"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: barbearia-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: barbearia-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:2.6.0
    container_name: barbearia-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: barbearia-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./monitoring/otel/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

volumes:
  barbearia_postgres_data:
  grafana_data: